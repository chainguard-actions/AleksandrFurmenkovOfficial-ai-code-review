name: Test X Provider
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          ai_provider: x
          x_api_key: fake-x-key
          x_model: grok-4
          owner: some-owner
          repo: some-repo
          pr_number: "1"
      - name: Assert action ran (x provider, sentinel repo expected to fail gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with x_api_key input"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
