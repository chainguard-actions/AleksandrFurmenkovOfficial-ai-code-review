name: Test File Filter Inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          ai_provider: openai
          openai_api_key: fake-openai-key
          openai_model: gpt-4o
          owner: some-owner
          repo: some-repo
          pr_number: "1"
          include_extensions: ".py,.js,.ts"
          exclude_extensions: ".md,.txt"
          include_paths: "src/,lib/"
          exclude_paths: "test/,docs/"
      - name: Assert action ran with file filter inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with include_extensions, exclude_extensions, include_paths, exclude_paths inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
